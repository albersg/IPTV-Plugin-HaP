[versions]
# Only what this build actually uses.
#
# This catalog previously declared a full modern stack — Compose BOM, tv-foundation,
# tv-material, Media3, Room, Hilt, Retrofit, OkHttp, Coroutines, Coil, WorkManager,
# LeakCanary, KSP — while `app/build.gradle.kts` depends on `core-ktx` alone. None of
# those were wired up, and the stale entries caused a real misreading during review:
# a pinned `tv-foundation:1.0.0-beta01` was taken as evidence that the library was
# still in beta, when Google Maven already ships a stable 1.0.0.
#
# If a dependency is added later, add it here and reference it from the build, so the
# catalog never again describes an application that does not exist.
agp = "8.10.1"

[libraries]
robolectric = { module = "org.robolectric:robolectric", version = "4.14.1" }
core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.18.0" }

# The channel list is the one list long enough to keep a viewport instead of every row in memory,
# so it is a RecyclerView with a ListAdapter and DiffUtil (D3). Declared here and referenced from
# the build, which is the rule this catalog opens with. 1.4.0 is Java-only: it pulls no Kotlin
# runtime into an application that has none.
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version = "1.4.0" }

# The updater's decision core is plain Java, so it is tested on the JVM.
junit = { group = "junit", name = "junit", version = "4.13.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
